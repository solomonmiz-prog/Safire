<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAFIRE Product</title>
    <link rel="icon" type="image/svg+xml" href="images/favicon-diamond.svg">
    <link rel="stylesheet" href="css/style.css?v=20261112-1">
</head>
<body style="background:#ffffff; color:#5f5c58;">
    <header class="site-header product-header" style="padding:16px 20px 12px;border-bottom:1px solid rgba(20,20,20,0.08);background:rgba(255,255,255,0.96);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:12px;box-shadow:0 1px 0 rgba(20,20,20,0.02);">
        <a href="index.html" class="back-link product-back-link" style="display:inline-flex;align-items:center;gap:8px;padding:8px 12px;border:1px solid rgba(20,20,20,0.12);background:rgba(255,255,255,0.9);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);color:#5f5c58;text-decoration:none;font-size:0.72rem;letter-spacing:0.12em;font-weight:300;">← Back to shop</a>
        <a href="cart.html" class="cart-link product-cart-link" style="display:inline-flex;align-items:center;gap:8px;color:#5f5c58;text-decoration:none;font-size:0.72rem;letter-spacing:0.12em;font-weight:300;line-height:1;">
            <svg class="cart-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true" style="display:block;width:18px;height:18px;stroke:#5f5c58;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;">
                <circle cx="9" cy="18" r="1.4"></circle>
                <circle cx="17" cy="18" r="1.4"></circle>
                <path d="M3 4h2l2.2 9.2a1 1 0 0 0 1 .8h8.8a1 1 0 0 0 1-.8L19 7H7"></path>
            </svg>
            <span id="cart-count" class="cart-count-badge">0</span>
        </a>
    </header>

    <main class="product-page">

        <section class="product-layout product" id="product-layout" hidden>
            <div class="media-stack">
                <div class="main-image-wrap" id="main-image-wrap">
                    <img id="main-image" src="" alt="Product image" draggable="false">
                    <div class="color-options-side" id="color-options"></div>
                </div>
                <div class="image-dots" id="image-dots"></div>
                <div class="thumbnail-row" id="thumbnail-row"></div>
            </div>

            <div class="info">
                <h1 id="product-name"></h1>
                <p class="price" id="product-price"></p>
                <p class="desc" id="product-description"></p>
                <div id="product-meta-row" style="display:flex;gap:16px;flex-wrap:wrap;align-items:center;margin-top:-4px;">
                    <p class="desc" id="product-gender" style="margin:0;font-weight:600;"></p>
                    <p class="desc" id="selected-color-label" style="margin:0;font-weight:600;"></p>
                </div>

                <div class="size-block" style="display:grid;gap:10px;">
                    <div class="size-header-row" style="display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:20px;width:100%;">
                        <p id="size-label" style="margin:0;font-size:0.7rem;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:#5f5c58;flex:0 0 auto;">Size</p>
                        <details class="size-guide-inline" id="size-guide-details" style="margin-left:auto;display:flex;justify-content:flex-end;color:#a39d96;">
                            <summary style="list-style:none;cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-size:0.6rem;line-height:1.2;letter-spacing:0.1em;text-transform:uppercase;color:#a39d96;font-weight:300;">Size guide <span aria-hidden="true" style="font-size:0.9rem;color:#a39d96;line-height:1;">↗</span></summary>
                            <div id="size-guide-text"></div>
                        </details>
                    </div>
                    <div class="size-grid" id="size-grid"></div>
                </div>

                <div class="product-actions" id="product-actions">
                    <button class="add-btn" id="add-to-cart-btn">Add to Cart</button>
                    <button class="checkout-inline-btn" id="checkout-inline-btn" type="button">Checkout</button>
                </div>

                <div class="accordion" id="product-accordion">
                    <details>
                        <summary>Details</summary>
                        <p id="details-text"></p>
                    </details>
                    <details>
                        <summary>Features</summary>
                        <p id="features-text"></p>
                    </details>
                    <details>
                        <summary>Care Instructions</summary>
                        <p id="care-text"></p>
                    </details>
                    <details>
                        <summary>Fabric</summary>
                        <p id="fabric-text"></p>
                    </details>
                </div>
            </div>
        </section>

        <p id="not-found" style="display:none;color:#666;">Product not found.</p>
    </main>

    <script src="https://js.stripe.com/v3/"></script>
    <script src="js/products.js?v=20261001"></script>
    <script src="js/cart.js?v=20261001"></script>
    <script>
        const params = new URLSearchParams(window.location.search);
        const productId = params.get('id');
        const requestedColor = params.get('color');
        const product = products.find((item) => item.id === productId);

        const layout = document.getElementById('product-layout');
        const notFound = document.getElementById('not-found');

        function formatPrice(value) {
            return Math.round(Number(value) || 0).toString();
        }

        function isBlackFridaySaleActive(now = new Date()) {
            return false;
        }

        function getSalePrice(value) {
            return Number(value) || 0;
        }

        function normalizeValue(value) {
            return String(value || '').trim().toLowerCase();
        }

        function normalizeColorKey(value) {
            return normalizeValue(value).split('/')[0].trim().replace(/\s+/g, '-');
        }

        function isProductSoldOut(product) {
            if (!product || !product.stock) return false;
            const quantities = Object.values(product.stock).map((qty) => Number(qty) || 0);
            if (quantities.length === 0) return !!product.soldOut;
            return quantities.every((qty) => qty <= 0) || !!product.soldOut;
        }

        function parseProductDetailSections(detailsText, careText) {
            const raw = String(detailsText || '').replace(/\r/g, '').trim();
            const paragraphs = raw.length > 0
                ? raw.split(/\n\s*\n+/).map((part) => part.trim()).filter(Boolean)
                : [];
            const allLines = raw.length > 0
                ? raw.split('\n').map((line) => line.trim()).filter(Boolean)
                : [];

            const headingKeys = new Set([
                'product code', 'model', 'gender', 'height', 'weight', 'size', 'features',
                'effects', 'fit', 'neckline', 'sleeve style', 'sleeve length', 'season', 'style',
                'material', 'fabric weight', 'thickness', 'elasticity', 'breathability'
            ]);

            function normalizeKey(line) {
                return String(line || '').toLowerCase().replace(/:$/, '').trim();
            }

            function isHeadingLine(line) {
                return headingKeys.has(normalizeKey(line));
            }

            function findValueForKey(lines, keyName) {
                const target = normalizeKey(keyName);
                for (let i = 0; i < lines.length; i += 1) {
                    const line = lines[i];
                    const lineKey = normalizeKey(line);
                    if (lineKey !== target) continue;

                    const colonIndex = line.indexOf(':');
                    if (colonIndex !== -1) {
                        const inlineValue = line.slice(colonIndex + 1).trim();
                        if (inlineValue) return inlineValue;
                    }

                    const next = lines[i + 1] ? lines[i + 1].trim() : '';
                    if (next && !isHeadingLine(next)) return next;
                    return '';
                }
                return '';
            }

            const sectionOrder = ['Note', 'Details', 'Gender', 'Model', 'Features', 'Care Instructions', 'Fabric'];
            const sections = {
                Note: '',
                Details: '',
                Gender: '',
                Model: '',
                Features: '',
                'Care Instructions': String(careText || '').trim(),
                Fabric: ''
            };

            if (String(detailsText || '').includes('Richardson 146R') || String(detailsText || '').includes('white diamond logo stitch on')) {
                sections.Details = 'Long top beanie waffle with white diamond logo stitch on. Richardson 146R one-size-fits-all knit beanie in black.';
                sections.Features = 'Waffle\nEmbroidery\nLong top\nRichardson 146R';
                return sectionOrder.reduce((acc, sectionName) => {
                    acc[sectionName] = String(sections[sectionName] || '').trim();
                    return acc;
                }, {});
            }

            const noteParts = [];
            if (paragraphs[0]) noteParts.push(paragraphs[0]);
            const warningParagraph = paragraphs.find((part) => {
                const value = part.toLowerCase();
                return value.includes('batch variations') || value.includes('minor batch differences') || value.includes('we appreciate your understanding') || value.includes('each piece is handcrafted');
            });
            if (warningParagraph && warningParagraph !== paragraphs[0]) {
                noteParts.push(warningParagraph);
            }
            sections.Note = noteParts.join('\n\n').trim();

            const productCode = findValueForKey(allLines, 'Product Code');
            if (productCode) {
                sections.Details += `Product Code: ${productCode}`;
            }

            const genderValue = findValueForKey(allLines, 'Gender');
            if (genderValue) {
                sections.Gender = genderValue;
            }

            const hasModelSignal = allLines.some((line) => normalizeKey(line) === 'model')
                || ['Height', 'Weight', 'Size'].some((key) => Boolean(findValueForKey(allLines, key)));

            const modelPairs = [];
            ['Gender', 'Height', 'Weight', 'Size'].forEach((key) => {
                const value = findValueForKey(allLines, key);
                if (value) modelPairs.push(`${key}: ${value}`);
            });
            if (hasModelSignal && modelPairs.length > 0) {
                sections.Model = modelPairs.join('\n');
            }

            const featurePairs = [];
            ['Effects', 'Fit', 'Neckline', 'Sleeve Style', 'Sleeve Length', 'Season', 'Style'].forEach((key) => {
                const value = findValueForKey(allLines, key);
                if (value) featurePairs.push(`${key}: ${value}`);
            });
            sections.Features = featurePairs.join('\n');

            const fabricPairs = [];
            ['Material', 'Fabric Weight', 'Thickness', 'Elasticity', 'Breathability'].forEach((key) => {
                const value = findValueForKey(allLines, key);
                if (value) fabricPairs.push(`${key}: ${value}`);
            });
            sections.Fabric = fabricPairs.join('\n');

            if (!sections.Details && paragraphs.length > 0) {
                sections.Details = paragraphs[0];
            }

            return sectionOrder.reduce((acc, sectionName) => {
                acc[sectionName] = String(sections[sectionName] || '').trim();
                return acc;
            }, {});
        }

        function setAccordionSection(contentId, text, shouldOpen = false) {
            const contentElement = document.getElementById(contentId);
            if (!contentElement) return;

            const detailsElement = contentElement.closest('details');
            const cleanedText = String(text || '').trim();

            if (!cleanedText) {
                contentElement.textContent = '';
                if (detailsElement) detailsElement.hidden = true;
                return;
            }

            contentElement.textContent = cleanedText;
            if (detailsElement) {
                detailsElement.hidden = false;
                detailsElement.open = !!shouldOpen;
            }
        }

        function setAccordionHTMLSection(contentId, html, shouldOpen = false) {
            const contentElement = document.getElementById(contentId);
            if (!contentElement) return;

            const detailsElement = contentElement.closest('details');
            const cleanedHTML = String(html || '').trim();

            if (!cleanedHTML) {
                contentElement.innerHTML = '';
                if (detailsElement) detailsElement.hidden = true;
                return;
            }

            contentElement.innerHTML = cleanedHTML;
            if (detailsElement) {
                detailsElement.hidden = false;
                detailsElement.open = !!shouldOpen;
            }
        }

        function setSizeGuideUnit(unit) {
            const contentElement = document.getElementById('size-guide-text');
            if (!contentElement) return;

            const nextUnit = unit === 'centimeters' ? 'centimeters' : 'inches';
            contentElement.dataset.activeUnit = nextUnit;

            contentElement.querySelectorAll('[data-size-unit]').forEach((button) => {
                const isActive = button.dataset.sizeUnit === nextUnit;
                button.setAttribute('aria-selected', String(isActive));
                button.classList.toggle('active', isActive);
                button.style.color = isActive ? '#5f5c58' : '#8a867f';
                button.style.fontWeight = isActive ? '700' : '600';
                button.style.borderBottomColor = isActive ? '#5f5c58' : 'transparent';
            });

            contentElement.querySelectorAll('[data-size-panel]').forEach((panel) => {
                const isActive = panel.dataset.sizePanel === nextUnit;
                panel.hidden = !isActive;
            });
        }

        function buildSizeGuideHTML(sizeGuide) {
            if (!sizeGuide) return '';

            const section = (title, data, unitKey) => `
                <div data-size-panel="${unitKey}" style="margin-top: 18px; background: #ffffff; color: #5f5c58; ${unitKey === 'inches' ? '' : ' display: none;'}" ${unitKey === 'inches' ? '' : 'hidden'}>
                    <h4 style="margin: 0 0 10px; font-size: 15px; color: #5f5c58; background: #ffffff;">${title}</h4>
                    <div style="overflow-x: auto; background: #ffffff;">
                        <table style="width: 100%; border-collapse: collapse; min-width: 520px; font-size: 13px; color: #5f5c58; background: #ffffff;">
                            <thead>
                                <tr>
                                    <th style="text-align: left; padding: 10px 8px; border-bottom: 1px solid rgba(20, 20, 20, 0.08); color: #5f5c58; background: #ffffff;">Size</th>
                                    ${data.sizes.map((size) => `<th style="text-align: left; padding: 10px 8px; border-bottom: 1px solid rgba(20, 20, 20, 0.08); color: #5f5c58; background: #ffffff;">${size}</th>`).join('')}
                                </tr>
                            </thead>
                            <tbody>
                                ${[
                                    ['Length', 'length'],
                                    ['Waist', 'waist'],
                                    ['Hip', 'hip'],
                                    ['Chest', 'chest'],
                                    ['Shoulder', 'shoulder'],
                                    ['Sleeve length', 'sleeveLength']
                                ].filter(([, key]) => Array.isArray(data[key]))
                                    .map(([label, key]) => `
                                <tr>
                                    <td style="padding: 10px 8px; border-bottom: 1px solid rgba(20, 20, 20, 0.06); font-weight: 600; color: #5f5c58; background: #ffffff;">${label}</td>
                                    ${data[key].map((value) => `<td style="padding: 10px 8px; border-bottom: 1px solid rgba(20, 20, 20, 0.06); color: #5f5c58; background: #ffffff;">${value}</td>`).join('')}
                                </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                </div>
            `;

            const howToMeasure = `
                <div style="margin-top: 18px; background: #ffffff; color: #5f5c58;">
                    <h4 style="margin: 0 0 10px; font-size: 15px; color: #5f5c58; background: #ffffff;">How to Measure</h4>
                    <div style="display: grid; gap: 10px; font-size: 13px; line-height: 1.6; background: #ffffff; color: #5f5c58;">
                        ${sizeGuide.howToMeasure.map((item, index) => `
                            <div style="padding: 10px 12px; border: 1px solid rgba(20, 20, 20, 0.08); border-radius: 8px; background: #ffffff; color: #5f5c58;">
                                <strong style="color: #5f5c58;">${index + 1}. ${item.title}</strong>
                                <div style="color: #5f5c58;">${item.description}</div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;

            return `
                <div style="display: grid; gap: 14px; background: #ffffff; color: #5f5c58;">
                    <p style="margin: 0; color: #5f5c58; background: #ffffff;">1-3 cm sizing differences may occur.</p>
                    <div style="display: flex; gap: 18px; border-bottom: 1px solid rgba(20, 20, 20, 0.08); align-items: flex-end; background: #ffffff;">
                        <button
                            type="button"
                            data-size-unit="inches"
                            aria-selected="true"
                            onclick="setSizeGuideUnit('inches')"
                            style="appearance: none; background: transparent; border: 0; padding: 0 0 12px; margin: 0; font: inherit; font-weight: 700; color: #5f5c58; border-bottom: 2px solid #5f5c58; cursor: pointer;"
                        >
                            Inches
                        </button>
                        <button
                            type="button"
                            data-size-unit="centimeters"
                            aria-selected="false"
                            onclick="setSizeGuideUnit('centimeters')"
                            style="appearance: none; background: transparent; border: 0; padding: 0 0 12px; margin: 0; font: inherit; font-weight: 700; color: #8a867f; border-bottom: 2px solid transparent; cursor: pointer;"
                        >
                            Centimeters
                        </button>
                    </div>
                    ${section('Inches', sizeGuide.inches, 'inches')}
                    ${section('Centimeters', sizeGuide.centimeters, 'centimeters')}
                    ${howToMeasure}
                </div>
            `;
        }

        if (!product) {
            notFound.style.display = 'block';
        } else {
            layout.hidden = false;
            // Use canonical price where possible: prefer listing's `productsData` (if present),
            // otherwise fall back to the local `product.price` from `products.js`.
            let originalPrice = Number(product.price) || 0;
            try {
                if (typeof productsData !== 'undefined' && Array.isArray(productsData) && productsData.length > 0) {
                    const normalizedPid = String(product.productId || product.id || '').trim();
                    const listingMatch = productsData.find((p) => {
                        if (!p) return false;
                        const ids = [p.productId, p.id, p.name].map((v) => String(v || '').trim());
                        return ids.includes(normalizedPid) || ids.includes(String(product.id || '').trim());
                    });
                    if (listingMatch && listingMatch.price !== undefined) {
                        originalPrice = Number(listingMatch.price) || originalPrice;
                    }
                }
            } catch (_e) {
                // ignore — keep local product.price
            }

            document.title = `${product.name} | SAFIRE`;
            document.getElementById('product-name').textContent = product.name;
            const priceElement = document.getElementById('product-price');
            const salePrice = getSalePrice(originalPrice);
            const hasSaleDiscount = isBlackFridaySaleActive() && originalPrice > 0 && salePrice < originalPrice;
            if (hasSaleDiscount) {
                priceElement.innerHTML = `
                    <span class="sale-price-row">
                        <span class="sale-price-current">$${formatPrice(salePrice)}</span>
                        <span class="sale-price-old">$${formatPrice(originalPrice)}</span>
                    </span>
                `;
            } else {
                priceElement.textContent = `$${formatPrice(originalPrice)}`;
            }

            // Ensure PDP uses the same canonical price as product cards.
            // Strategy: prefer global `productsData` (used by product cards). If absent,
            // fetch `/index.html` and parse its `productsData` blocks to find a match.
            async function getCanonicalPriceFor(product) {
                try {
                    const normalizedPid = String(product.productId || product.id || '').trim();
                    // 1) If `productsData` is exposed on the page, use it.
                    if (typeof productsData !== 'undefined' && Array.isArray(productsData)) {
                        const match = productsData.find((p) => String(p.productId || p.id || p.name || '').trim() === normalizedPid || String(p.id || '').trim() === String(product.id || '').trim());
                        if (match && match.price !== undefined) return Number(match.price) || null;
                    }

                    // 2) Try fetching the site's listing page and parse `productsData` declarations.
                    const resp = await fetch('/index.html', { cache: 'no-store' });
                    if (!resp.ok) return null;
                    const text = await resp.text();
                    // Regex to find product blocks with productId and price: { ... productId: "id", ... price: 60,
                    const re = /\{[^}]*?productId\s*:\s*\"([\w\-]+)\"[\s\S]*?price\s*:\s*(\d+\.?\d*)/g;
                    let m;
                    while ((m = re.exec(text)) !== null) {
                        const pid = m[1];
                        const price = Number(m[2]);
                        if (pid === normalizedPid) return price;
                    }
                } catch (_e) {
                    // ignore errors and fall back to local price
                }
                return null;
            }

            (async () => {
                const canonical = await getCanonicalPriceFor(product);
                if (canonical !== null && Number(canonical) !== Number(originalPrice)) {
                    originalPrice = Number(canonical);
                    const refreshedSalePrice = getSalePrice(originalPrice);
                    const refreshedDiscount = isBlackFridaySaleActive() && originalPrice > 0 && refreshedSalePrice < originalPrice;
                    if (refreshedDiscount) {
                        priceElement.innerHTML = `
                            <span class="sale-price-row">
                                <span class="sale-price-current">$${formatPrice(refreshedSalePrice)}</span>
                                <span class="sale-price-old">$${formatPrice(originalPrice)}</span>
                            </span>
                        `;
                    } else {
                        priceElement.textContent = `$${formatPrice(originalPrice)}`;
                    }
                }
            })();
            document.getElementById('product-description').textContent = product.description;

            const parsedSections = parseProductDetailSections(product.details, product.careInstructions);
            const isWaffleBeanie = String(product.id || product.productId || '').trim() === 'waffle-beanie';
            setAccordionSection('details-text', parsedSections.Details);
            setAccordionSection('features-text', parsedSections.Features);
            setAccordionSection('care-text', parsedSections['Care Instructions']);
            setAccordionSection('fabric-text', parsedSections.Fabric);

            const sizeGuideDetails = document.getElementById('size-guide-details');
            if (sizeGuideDetails) {
                sizeGuideDetails.open = false;
                if (product.sizeGuide) {
                    sizeGuideDetails.hidden = false;
                    setAccordionHTMLSection('size-guide-text', buildSizeGuideHTML(product.sizeGuide), false);
                    const sizeGuideText = document.getElementById('size-guide-text');
                    if (sizeGuideText) {
                        sizeGuideText.style.display = 'none';
                    }
                } else {
                    sizeGuideDetails.hidden = true;
                    const sizeGuideText = document.getElementById('size-guide-text');
                    if (sizeGuideText) sizeGuideText.innerHTML = '';
                }
            }

            if (sizeGuideDetails && product.sizeGuide) {
                sizeGuideDetails.addEventListener('toggle', () => {
                    const sizeGuideText = document.getElementById('size-guide-text');
                    if (!sizeGuideText) return;
                    sizeGuideText.style.display = sizeGuideDetails.open ? 'block' : 'none';
                });
            }

            if (isWaffleBeanie) {
                const accordion = document.getElementById('product-accordion');
                if (accordion) {
                    accordion.querySelectorAll('details').forEach((detail) => {
                        const summary = detail.querySelector('summary');
                        if (summary && ['Note', 'Model', 'Size Guide'].includes(summary.textContent.trim())) {
                            detail.remove();
                        }
                    });
                }
            }

            const genderText = parsedSections.Gender || product.gender || '';
            const genderElement = document.getElementById('product-gender');
            const productMetaRow = document.getElementById('product-meta-row');
            if (genderElement) {
                genderElement.textContent = genderText ? `Gender: ${genderText}` : '';
                genderElement.hidden = !genderText;
            }
            if (productMetaRow) {
                productMetaRow.hidden = !genderText && !product.colorways;
            }

            const mainImage = document.getElementById('main-image');
            const mainImageWrap = document.getElementById('main-image-wrap');
            const thumbRow = document.getElementById('thumbnail-row');
            const colorOptions = document.getElementById('color-options');
            const selectedColorLabel = document.getElementById('selected-color-label');

            if (mainImage) {
                mainImage.style.objectFit = 'contain';
                mainImage.style.objectPosition = 'center';
                mainImage.style.filter = 'none';
                mainImage.style.opacity = '1';
                mainImage.style.background = '#ffffff';
            }

            if (isWaffleBeanie) {
                const imageWrap = document.getElementById('main-image-wrap');
                if (imageWrap) {
                    imageWrap.style.background = '#ffffff';
                    imageWrap.style.borderRadius = '12px';
                    imageWrap.style.padding = '20px';
                    imageWrap.style.display = 'flex';
                    imageWrap.style.alignItems = 'center';
                    imageWrap.style.justifyContent = 'center';
                }
                mainImage.style.objectFit = 'contain';
                mainImage.style.objectPosition = 'center';
                mainImage.style.transform = 'scale(0.9)';
                mainImage.style.background = '#ffffff';
                mainImage.style.padding = '10px';
                mainImage.src = 'images/blackwafflebeanie.png';
            }

            let activeImages = [...(product.images || [])];
            if (isWaffleBeanie && activeImages.length === 0) {
                activeImages = ['images/blackwafflebeanie.png'];
            }
            if (isWaffleBeanie && Array.isArray(product.colorways) && product.colorways.length > 0) {
                product.colorways = [{
                    name: 'Black',
                    hex: '#2a2724',
                    images: ['images/blackwafflebeanie.png']
                }];
            }
            let activeGalleryImages = [...activeImages];
            let currentImageIndex = 0;
            let selectedColorName = null;
            let selectedColorDisplayName = null;
            let zoomEnabled = false;
            let zoomActive = false;
            const isMeshShortsProduct = product.id === 'mesh-drawstring-shorts';
            const collageUrlCache = new Map();

            function clearImageZoom() {
                zoomActive = false;
                if (!mainImage) return;
                mainImage.classList.remove('zoomed');
                mainImage.style.transformOrigin = '50% 50%';
                if (mainImageWrap) {
                    mainImageWrap.classList.remove('zoom-active');
                }
            }

            function setImageZoomState(active) {
                if (!zoomEnabled || !mainImage) return;
                zoomActive = !!active;
                mainImage.classList.toggle('zoomed', zoomActive);
                if (mainImageWrap) {
                    mainImageWrap.classList.toggle('zoom-active', zoomActive);
                }
                if (!zoomActive) {
                    mainImage.style.transformOrigin = '50% 50%';
                }
            }

            function updateZoomOriginFromPoint(clientX, clientY) {
                if (!zoomActive || !mainImageWrap || !mainImage) return;
                const rect = mainImageWrap.getBoundingClientRect();
                if (!rect.width || !rect.height) return;
                const x = ((clientX - rect.left) / rect.width) * 100;
                const y = ((clientY - rect.top) / rect.height) * 100;
                const clampedX = Math.max(0, Math.min(100, x));
                const clampedY = Math.max(0, Math.min(100, y));
                mainImage.style.transformOrigin = `${clampedX}% ${clampedY}%`;
            }

            function loadImageElement(src) {
                return new Promise((resolve, reject) => {
                    const image = new Image();
                    image.onload = () => resolve(image);
                    image.onerror = () => reject(new Error(`Failed to load ${src}`));
                    image.src = src;
                });
            }

            async function buildCollageFromSources(sources) {
                const safeImages = (Array.isArray(sources) ? sources : []).slice(0, 4);
                if (safeImages.length < 4) return null;

                const cacheKey = safeImages.join('|');
                if (collageUrlCache.has(cacheKey)) {
                    return collageUrlCache.get(cacheKey);
                }

                try {
                    const loaded = await Promise.all(safeImages.map((src) => loadImageElement(src)));
                    const canvas = document.createElement('canvas');
                    const size = 1200;
                    const gap = 8;
                    const cell = Math.floor((size - gap) / 2);
                    canvas.width = size;
                    canvas.height = size;

                    const context = canvas.getContext('2d');
                    if (!context) return null;

                    context.fillStyle = '#ffffff';
                    context.fillRect(0, 0, size, size);

                    const positions = [
                        { x: 0, y: 0 },
                        { x: cell + gap, y: 0 },
                        { x: 0, y: cell + gap },
                        { x: cell + gap, y: cell + gap }
                    ];

                    loaded.forEach((image, index) => {
                        const slot = positions[index];
                        if (!slot) return;

                        context.save();
                        context.beginPath();
                        context.rect(slot.x, slot.y, cell, cell);
                        context.clip();

                        const scale = Math.max(cell / image.width, cell / image.height);
                        const drawWidth = image.width * scale;
                        const drawHeight = image.height * scale;
                        const drawX = slot.x + (cell - drawWidth) / 2;
                        const drawY = slot.y + (cell - drawHeight) / 2;

                        context.drawImage(image, drawX, drawY, drawWidth, drawHeight);
                        context.restore();
                    });

                    context.strokeStyle = '#2a2724';
                    context.lineWidth = 8;
                    context.strokeRect(0, 0, size, size);

                    return await new Promise((resolve) => {
                        canvas.toBlob((blob) => {
                            if (!blob) {
                                resolve(null);
                                return;
                            }

                            const objectUrl = URL.createObjectURL(blob);
                            collageUrlCache.set(cacheKey, objectUrl);
                            resolve(objectUrl);
                        }, 'image/png');
                    });
                } catch (_error) {
                    return null;
                }
            }

            function getMeshFrontAndBack(images) {
                const safeImages = Array.isArray(images) ? images : [];
                if (safeImages.length >= 2) {
                    return [safeImages[0], safeImages[1]];
                }
                return safeImages.slice(0, 2);
            }

            async function buildMeshFixedCollages() {
                if (!isMeshShortsProduct) return [];

                const collageSetOne = [
                    'images/meshshorts-1.png',
                    'images/meshshort-2.png',
                    'images/meshshorts-3.png',
                    'images/meshshorts-4.png'
                ];
                const collageSetTwo = [
                    'images/meshshort-5.png',
                    'images/meshshorts-6.png',
                    'images/meshshorts-7.png',
                    'images/meshshorts-8.png'
                ];

                const [firstCollage, secondCollage] = await Promise.all([
                    buildCollageFromSources(collageSetOne),
                    buildCollageFromSources(collageSetTwo)
                ]);

                return [firstCollage, secondCollage].filter(Boolean);
            }

            function setMainImage(src, thumbButton, imageIndex = 0) {
                mainImage.src = src;
                clearImageZoom();
                currentImageIndex = imageIndex;
                document.querySelectorAll('.thumb').forEach((thumb) => thumb.classList.remove('active'));
                if (thumbButton) thumbButton.classList.add('active');

                // Update active dot and thumbnail states from the canonical index.
                document.querySelectorAll('.dot').forEach((dot, i) => {
                    dot.classList.toggle('active', i === imageIndex);
                });
                document.querySelectorAll('.thumb').forEach((thumb, i) => {
                    thumb.classList.toggle('active', i === imageIndex);
                });
            }

            let isSwipeAnimating = false;
            let didImageSwipe = false;

            function showImageAtIndex(index, options = {}) {
                if (!Array.isArray(activeGalleryImages) || activeGalleryImages.length === 0) return;
                const boundedIndex = Math.max(0, Math.min(index, activeGalleryImages.length - 1));
                if (boundedIndex === currentImageIndex) return;

                const targetThumb = thumbRow.children[boundedIndex] || null;
                const shouldAnimate = !!options.animate && !isSwipeAnimating;
                const direction = options.direction === 'right' ? 'right' : 'left';

                if (!shouldAnimate || typeof mainImage.animate !== 'function') {
                    setMainImage(activeGalleryImages[boundedIndex], targetThumb, boundedIndex);
                    return;
                }

                const exitX = direction === 'left' ? -22 : 22;
                const enterX = direction === 'left' ? 22 : -22;
                isSwipeAnimating = true;

                const exitAnimation = mainImage.animate(
                    [
                        { transform: 'translateX(0)', opacity: 1 },
                        { transform: `translateX(${exitX}px)`, opacity: 0.28 }
                    ],
                    { duration: 140, easing: 'cubic-bezier(0.4, 0, 1, 1)', fill: 'forwards' }
                );

                exitAnimation.onfinish = () => {
                    setMainImage(activeGalleryImages[boundedIndex], targetThumb, boundedIndex);
                    mainImage.animate(
                        [
                            { transform: `translateX(${enterX}px)`, opacity: 0.28 },
                            { transform: 'translateX(0)', opacity: 1 }
                        ],
                        { duration: 220, easing: 'cubic-bezier(0.22, 1, 0.36, 1)', fill: 'forwards' }
                    ).onfinish = () => {
                        isSwipeAnimating = false;
                    };
                };

                exitAnimation.oncancel = () => {
                    isSwipeAnimating = false;
                };
            }

            function renderGalleryFrames(frames) {
                thumbRow.innerHTML = '';
                const dotsDiv = document.getElementById('image-dots');
                dotsDiv.innerHTML = '';

                frames.forEach((src, index) => {
                    const button = document.createElement('button');
                    button.className = `thumb${index === 0 ? ' active' : ''}`;
                    button.type = 'button';
                    button.setAttribute('aria-label', `View image ${index + 1}`);
                    button.innerHTML = `<img src="${src}" alt="${product.name} thumbnail ${index + 1}" loading="lazy" decoding="async">`;
                    button.addEventListener('click', () => setMainImage(src, button, index));
                    thumbRow.appendChild(button);
                    
                    const dot = document.createElement('span');
                    dot.className = `dot${index === 0 ? ' active' : ''}`;
                    dot.addEventListener('click', () => setMainImage(src, button, index));
                    dotsDiv.appendChild(dot);
                });
                currentImageIndex = 0;
                mainImage.src = frames[0] || '';
                mainImage.loading = 'eager';
                mainImage.decoding = 'async';
                mainImage.alt = selectedColorName ? `${product.name} - ${selectedColorName}` : product.name;
            }

            function renderThumbnails(images) {
                if (!isMeshShortsProduct) {
                    activeGalleryImages = [...images];
                    renderGalleryFrames(activeGalleryImages);
                    return;
                }

                const frontAndBack = getMeshFrontAndBack(images);
                activeGalleryImages = [...frontAndBack];
                renderGalleryFrames(activeGalleryImages);

                buildMeshFixedCollages().then((collages) => {
                    if (collages.length < 2) return;

                    const currentFrontAndBack = getMeshFrontAndBack(activeImages);
                    if (
                        currentFrontAndBack.length !== frontAndBack.length
                        || currentFrontAndBack.some((src, index) => src !== frontAndBack[index])
                    ) {
                        return;
                    }

                    activeGalleryImages = [...frontAndBack, ...collages];
                    renderGalleryFrames(activeGalleryImages);
                });
            }

            if (Array.isArray(product.colorways) && product.colorways.length > 0) {
                colorOptions.classList.add('visible');

                const requestedColorIndex = (() => {
                    if (!requestedColor) return 0;
                    const target = normalizeValue(requestedColor);
                    const index = product.colorways.findIndex((colorway) => normalizeValue(colorway.name) === target);
                    return index >= 0 ? index : 0;
                })();

                product.colorways.forEach((colorway, index) => {
                    const colorBtn = document.createElement('button');
                    colorBtn.type = 'button';
                    colorBtn.className = `color-dot${index === requestedColorIndex ? ' active' : ''}`;
                    colorBtn.style.backgroundColor = colorway.hex;
                    colorBtn.setAttribute('aria-label', `Select ${colorway.name}`);
                    colorBtn.title = colorway.name;
                    colorBtn.value = normalizeValue(colorway.name);

                    colorBtn.addEventListener('click', () => {
                        colorOptions.querySelectorAll('.color-dot').forEach((dot) => dot.classList.remove('active'));
                        colorBtn.classList.add('active');
                        selectedColorName = colorBtn.value;
                        selectedColorDisplayName = colorway.name;
                        if (selectedColorLabel) {
                            selectedColorLabel.textContent = `Color: ${selectedColorDisplayName}`;
                        }
                        activeImages = [...colorway.images];
                        renderThumbnails(activeImages);
                    });

                    colorOptions.appendChild(colorBtn);
                });

                const selectedIndex = requestedColorIndex;
                selectedColorName = normalizeValue(product.colorways[selectedIndex].name);
                selectedColorDisplayName = product.colorways[selectedIndex].name;
                if (selectedColorLabel) {
                    selectedColorLabel.textContent = `Color: ${selectedColorDisplayName}`;
                }
                activeImages = [...product.colorways[selectedIndex].images];
            } else if (selectedColorLabel) {
                selectedColorLabel.textContent = '';
            }

            renderThumbnails(activeImages);

            zoomEnabled = !!mainImage && !!mainImageWrap;
            if (zoomEnabled) {
                mainImageWrap.classList.add('zoom-enabled');

                mainImage.addEventListener('click', (event) => {
                    if (didImageSwipe) {
                        didImageSwipe = false;
                        return;
                    }

                    if (!zoomActive) {
                        updateZoomOriginFromPoint(event.clientX, event.clientY);
                    }
                    setImageZoomState(!zoomActive);
                });

                mainImage.addEventListener('pointermove', (event) => {
                    if (!zoomActive) return;
                    updateZoomOriginFromPoint(event.clientX, event.clientY);
                });

                mainImage.addEventListener('mouseleave', () => {
                    if (!zoomActive) return;
                    setImageZoomState(false);
                });
            }

            let touchStartX = 0;
            let touchStartY = 0;
            let touchCurrentX = 0;
            let touchCurrentY = 0;
            const swipeThreshold = 35;

            mainImage.addEventListener('touchstart', (event) => {
                if (!event.touches || event.touches.length !== 1) return;
                touchStartX = event.touches[0].clientX;
                touchStartY = event.touches[0].clientY;
                touchCurrentX = touchStartX;
                touchCurrentY = touchStartY;
            }, { passive: true });

            mainImage.addEventListener('touchmove', (event) => {
                if (!event.touches || event.touches.length !== 1) return;
                if (zoomActive) {
                    updateZoomOriginFromPoint(event.touches[0].clientX, event.touches[0].clientY);
                    if (event.cancelable) event.preventDefault();
                    return;
                }
                touchCurrentX = event.touches[0].clientX;
                touchCurrentY = event.touches[0].clientY;
                const deltaX = touchCurrentX - touchStartX;
                const deltaY = touchCurrentY - touchStartY;

                if (Math.abs(deltaX) > 8 && Math.abs(deltaX) > Math.abs(deltaY) && event.cancelable) {
                    event.preventDefault();
                }
            }, { passive: false });

            mainImage.addEventListener('touchend', (event) => {
                if (!event.changedTouches || event.changedTouches.length !== 1) return;
                if (zoomActive) return;
                const deltaX = event.changedTouches[0].clientX - touchStartX;
                const deltaY = event.changedTouches[0].clientY - touchStartY;

                // Only treat mostly-horizontal gestures as image swipes.
                if (Math.abs(deltaX) < swipeThreshold || Math.abs(deltaX) <= Math.abs(deltaY)) {
                    return;
                }

                if (deltaX < 0) {
                    didImageSwipe = true;
                    showImageAtIndex(currentImageIndex + 1, { animate: true, direction: 'left' });
                } else {
                    didImageSwipe = true;
                    showImageAtIndex(currentImageIndex - 1, { animate: true, direction: 'right' });
                }
            }, { passive: true });

            let pointerStartX = 0;
            let pointerStartY = 0;
            let activePointerId = null;

            mainImage.addEventListener('pointerdown', (event) => {
                if (event.pointerType === 'mouse' && event.button !== 0) return;
                activePointerId = event.pointerId;
                pointerStartX = event.clientX;
                pointerStartY = event.clientY;
                if (typeof mainImage.setPointerCapture === 'function') {
                    try {
                        mainImage.setPointerCapture(event.pointerId);
                    } catch (_) {
                        // Ignore pointer capture errors on unsupported browsers.
                    }
                }
            });

            mainImage.addEventListener('pointerup', (event) => {
                if (activePointerId !== event.pointerId) return;

                if (typeof mainImage.releasePointerCapture === 'function') {
                    try {
                        mainImage.releasePointerCapture(event.pointerId);
                    } catch (_) {
                        // Ignore pointer capture errors on unsupported browsers.
                    }
                }

                const deltaX = event.clientX - pointerStartX;
                const deltaY = event.clientY - pointerStartY;
                activePointerId = null;

                if (zoomActive) return;

                if (Math.abs(deltaX) < swipeThreshold || Math.abs(deltaX) <= Math.abs(deltaY)) {
                    return;
                }

                if (deltaX < 0) {
                    didImageSwipe = true;
                    showImageAtIndex(currentImageIndex + 1, { animate: true, direction: 'left' });
                } else {
                    didImageSwipe = true;
                    showImageAtIndex(currentImageIndex - 1, { animate: true, direction: 'right' });
                }
            });

            mainImage.addEventListener('pointercancel', (event) => {
                if (activePointerId === event.pointerId) {
                    if (typeof mainImage.releasePointerCapture === 'function') {
                        try {
                            mainImage.releasePointerCapture(event.pointerId);
                        } catch (_) {
                            // Ignore pointer capture errors on unsupported browsers.
                        }
                    }
                    activePointerId = null;
                }
            });

            const addToCartButton = document.getElementById('add-to-cart-btn');
            const checkoutInlineButton = document.getElementById('checkout-inline-btn');
            const sizeLabel = document.getElementById('size-label');
            const sizeGrid = document.getElementById('size-grid');
            const isSoldOut = isProductSoldOut(product);

            if (addToCartButton) {
                addToCartButton.textContent = isSoldOut ? 'Sold Out' : 'Add to Cart';
                addToCartButton.disabled = isSoldOut;
                if (isSoldOut) {
                    addToCartButton.classList.add('disabled');
                    addToCartButton.style.opacity = '0.8';
                    addToCartButton.style.filter = 'grayscale(1)';
                }
            }

            if (checkoutInlineButton) {
                checkoutInlineButton.disabled = isSoldOut;
                checkoutInlineButton.style.opacity = isSoldOut ? '0.7' : '1';
                checkoutInlineButton.style.filter = isSoldOut ? 'grayscale(1)' : 'none';
            }

            if (isSoldOut && mainImage) {
                mainImage.style.filter = 'none';
                mainImage.style.opacity = '1';
            }

            let selectedSize = null;

            if (String(product.id || '').trim() === 'waffle-beanie') {
                if (sizeLabel) sizeLabel.textContent = isSoldOut ? 'Sold Out' : 'Size';
                sizeGrid.innerHTML = '';
                const button = document.createElement('button');
                button.type = 'button';
                button.className = `size-btn${isSoldOut ? ' disabled' : ' active'}`;
                button.textContent = 'One Size';
                button.value = 'one-size';
                button.disabled = isSoldOut;
                if (!isSoldOut) selectedSize = 'one-size';
                button.addEventListener('click', () => {
                    if (isSoldOut) return;
                    sizeGrid.querySelectorAll('.size-btn').forEach((item) => item.classList.remove('active'));
                    button.classList.add('active');
                    selectedSize = button.value;
                });
                sizeGrid.appendChild(button);
            } else {
                sizeGrid.innerHTML = '';
                product.sizes.forEach((size) => {
                    const button = document.createElement('button');
                    button.type = 'button';
                    button.className = 'size-btn';
                    button.textContent = size;
                    button.value = normalizeValue(size);
                    button.addEventListener('click', () => {
                        sizeGrid.querySelectorAll('.size-btn').forEach((item) => item.classList.remove('active'));
                        button.classList.add('active');
                        selectedSize = button.value;
                    });
                    sizeGrid.appendChild(button);
                });
            }

            function resolveSelectionFromProduct() {
                const productContainer = layout || document;
                const activeSizeButton = productContainer.querySelector('.size-btn.active');
                const activeColorButton = productContainer.querySelector('.color-dot.active');

                const scopedSize = selectedSize
                    || (activeSizeButton ? normalizeValue(activeSizeButton.value || activeSizeButton.textContent) : null);
                const scopedColor = activeColorButton ? normalizeColorKey(activeColorButton.value || activeColorButton.title) : normalizeColorKey(selectedColorName || 'default');

                return { scopedSize, scopedColor };
            }

            document.querySelectorAll('.add-btn').forEach((button) => {
                const cleanButton = button.cloneNode(true);
                cleanButton.textContent = isSoldOut ? 'Sold Out' : 'Add to Cart';
                cleanButton.disabled = isSoldOut;
                if (isSoldOut) cleanButton.classList.add('disabled');
                button.replaceWith(cleanButton);

                cleanButton.addEventListener('click', () => {
                    if (isSoldOut) {
                        alert('This item is sold out.');
                        return;
                    }

                    const { scopedSize, scopedColor } = resolveSelectionFromProduct();
                    if (!scopedSize) {
                        alert('Please select a size first.');
                        return;
                    }

                    addToCart({
                        productId: product.id,
                        name: product.name,
                        color: scopedColor,
                        size: scopedSize,
                        price: originalPrice
                    });

                    console.log('[Cart Debug] added key:', `${normalizeColorKey(scopedColor || 'default')}-${String(scopedSize || '').trim().toLowerCase()}`);
                    alert('Added to cart');
                });
            });

            if (checkoutInlineButton) {
                checkoutInlineButton.addEventListener('click', async () => {
                    if (isSoldOut) {
                        alert('This item is sold out.');
                        return;
                    }

                    const { scopedSize, scopedColor } = resolveSelectionFromProduct();
                    if (!scopedSize) {
                        alert('Please select a size first.');
                        return;
                    }

                    await directCheckoutProduct({
                        productId: product.id,
                        name: product.name,
                        color: scopedColor,
                        size: scopedSize,
                        quantity: 1,
                        price: originalPrice
                    });
                });
            }

            updateCartCount();
        }
    </script>
</body>
</html>
