<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAFIRE Cart</title>
    <link rel="icon" type="image/svg+xml" href="images/favicon-diamond.svg">
    <link rel="stylesheet" href="css/style.css?v=20261113-1">
</head>
<body style="background:#ffffff; color:#6d6964;">
    <header class="site-header product-header" style="padding:16px 20px 12px;border-bottom:1px solid rgba(20,20,20,0.08);background:rgba(255,255,255,0.96);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:12px;box-shadow:0 1px 0 rgba(20,20,20,0.02);">
        <a href="index.html" class="back-link product-back-link" style="display:inline-flex;align-items:center;gap:8px;padding:8px 12px;border:1px solid rgba(20,20,20,0.12);background:rgba(255,255,255,0.9);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);color:#5f5c58;text-decoration:none;font-size:0.72rem;letter-spacing:0.12em;font-weight:300;">← Back to shop</a>
        <div class="cart-brand">SAFIRE</div>
    </header>

    <main class="cart-page">
        <h1 class="cart-title">Your Bag</h1>
        <div id="cart-status" style="display:none;margin:12px 0;padding:12px 14px;border-radius:8px;font-weight:600;"></div>
        <p id="cart-section-label" class="cart-section-label">0 items in your bag</p>

        <section id="cart-items" class="cart-items-list"></section>

        <section class="cart-summary">
            <div class="summary-row">
                <span>Subtotal</span>
                <span class="summary-value" id="cart-subtotal">$0</span>
            </div>
            <div class="summary-row">
                <span>Delivery fee</span>
                <span class="summary-value free">Free</span>
            </div>
            <div class="cart-total-row">
                <span>Total</span>
                <strong id="cart-total">$0</strong>
            </div>
            <button class="add-btn" type="button" onclick="checkout()">Proceed to Checkout</button>
        </section>

        <section class="frequently-bought">
            <p class="frequently-bought-label">Frequently Bought With</p>
            <div id="frequently-bought-list" class="frequently-bought-list"></div>
        </section>
    </main>

    <script src="https://js.stripe.com/v3/"></script>
    <script src="js/products.js?v=20261113-1"></script>
    <script src="js/cart.js?v=20261113-1"></script>
    <script>
        handleCheckoutStatus();
        renderCart();
    </script>
</body>
</html>
